

on: 
  push: 
    branches: ["main"]
  pull_request: 
    branches: ["main"]

jobs: 
  build:
    strategy: 
      matrix: 
        node-version: [22.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 
        uses: actions/setup-node@v4

      - run: npm ci
      - run: npm run build --if-present
      - run: npm test

